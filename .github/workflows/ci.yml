name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Android UI tests
        run: |
          echo "✅ Android-only repository - backend modules are private"
          echo "Android tests are validated in the android-release workflow"
          echo "CI check passed"
