plugins {
  id 'com.android.application'
}

// Release signing material is supplied out of band: android/keystore.properties
// for local builds (gitignored), or the same four values as ASB_ANDROID_* env
// vars in CI. A checkout with neither still builds — assembleRelease just emits
// an unsigned APK rather than failing, so nothing here is required to compile.
def signingProperties = new Properties()
def signingPropertiesFile = new File(rootDir, 'keystore.properties')
if (signingPropertiesFile.exists()) {
  signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def signingValue = { String key, String envName ->
  signingProperties.getProperty(key) ?: System.getenv(envName)
}
def releaseKeystore = signingValue('storeFile', 'ASB_ANDROID_STORE_FILE')
def hasReleaseSigning = releaseKeystore != null && !releaseKeystore.isEmpty()

// Explicit debug-only compatibility experiment. Normal/release builds keep
// the existing native defaults. Both A/B variants use the same options mask.
def connectorMonitorAB = providers.gradleProperty('connectorMonitorAB').getOrElse('none')
if (!(connectorMonitorAB in ['none', 'on', 'off'])) {
  throw new GradleException('connectorMonitorAB must be none, on or off')
}

android {
  namespace 'com.otterview.agentsessionbridge'
  compileSdk 35
  buildToolsVersion '35.0.0'
  defaultConfig {
    applicationId 'com.otterview.agentsessionbridge'
    minSdkVersion 24
    targetSdkVersion 35
    versionCode 78
    versionName '0.5.62'
    buildConfigField 'boolean', 'CONNECTOR_MONITOR_AB', 'false'
    buildConfigField 'boolean', 'CONNECTOR_MONITOR_OFF', 'false'
  }
  buildFeatures { buildConfig true }
  flavorDimensions 'language'
  productFlavors {
    zh {
      dimension 'language'
      buildConfigField 'String', 'APP_LANGUAGE', '"zh-CN"'
      resValue 'string', 'app_name', '办公小镇'
    }
    en {
      dimension 'language'
      applicationIdSuffix '.en'
      buildConfigField 'String', 'APP_LANGUAGE', '"en"'
      resValue 'string', 'app_name', 'Office Town'
    }
  }
  if (hasReleaseSigning) {
    signingConfigs {
      release {
        storeFile file(releaseKeystore)
        storePassword signingValue('storePassword', 'ASB_ANDROID_STORE_PASSWORD')
        keyAlias signingValue('keyAlias', 'ASB_ANDROID_KEY_ALIAS')
        keyPassword signingValue('keyPassword', 'ASB_ANDROID_KEY_PASSWORD')
      }
    }
  }
  buildTypes {
    debug {
      applicationIdSuffix '.debug'
      buildConfigField 'boolean', 'CONNECTOR_MONITOR_AB', connectorMonitorAB == 'none' ? 'false' : 'true'
      buildConfigField 'boolean', 'CONNECTOR_MONITOR_OFF', connectorMonitorAB == 'off' ? 'true' : 'false'
    }
    release {
      if (hasReleaseSigning) {
        signingConfig signingConfigs.release
      }
    }
  }
  compileOptions {
    // Backport java.time and java.nio.file to the supported Android 7 devices.
    coreLibraryDesugaringEnabled true
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
  implementation 'com.github.mwiede:jsch:0.2.26'
  // Android does not load JSch's Java 15 multi-release Ed25519 classes.
  // Keep its supported portable crypto fallback available for SSH keys.
  implementation 'org.bouncycastle:bcprov-jdk15to18:1.86'
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
  // ZXing 4.3.0's published POM omits its AndroidX runtime dependencies.
  // CaptureManager needs ContextCompat/ActivityCompat when opening the camera.
  implementation 'androidx.core:core:1.19.1'
  // Third-party webrtc-sdk precompiled BSD-3-Clause build; full notices ship in assets/licenses.
  implementation 'io.github.webrtc-sdk:android:150.7871.01'
  testImplementation 'junit:junit:4.13.2'
}

apply from: rootProject.file('sherpa-offline.gradle')
// Native Java regression harnesses use the exact runtime artifacts resolved by Android.
tasks.register('prepareNativeTestDependencies') {
  doLast { configurations.getByName('zhDebugRuntimeClasspath').files }
}
